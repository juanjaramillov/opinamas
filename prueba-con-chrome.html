<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Prueba B · iPhone con Chrome</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8FAFC;color:#0F172A;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px;text-align:center}main{max-width:380px}p{color:#475569}#log{font-size:13px;color:#475569;margin-top:16px}</style></head>
<body><main><h1 style="font-size:20px">Prueba B · iPhone con Chrome</h1><p>Intentando abrir Chrome; si no se puede, Safari en 1,5 segundos…</p><div id="log"></div></main>
<script>
  // Prueba: misma lógica que tendría la página puente («Chrome primero, si no Safari»).
  var destino = "https://opinamas-app.vercel.app/login";
  var salio = false;
  document.addEventListener("visibilitychange", function () { if (document.hidden) salio = true; });
  window.addEventListener("pagehide", function () { salio = true; });
  location.href = "googlechromes://opinamas-app.vercel.app/login";
  setTimeout(function () {
    document.getElementById("log").textContent = salio ? "Se abrió otra app: no se intenta Safari." : "Chrome no se abrió: ahora Safari.";
    if (!salio) location.href = "x-safari-" + destino;
  }, 1500);
</script></body></html>
